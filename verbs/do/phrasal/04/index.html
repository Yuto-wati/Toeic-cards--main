<!doctype html>
<html lang="ja">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>DO 句動詞 04｜多義語・注意</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&family=Poppins:wght@600;700&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: #f8fafc;
            color: #334155;
        }

        .font-poppins {
            font-family: 'Poppins', sans-serif;
        }

        .hover-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .hover-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, .1);
        }
    </style>
</head>

<body class="p-6 md:p-12">
    <div class="max-w-4xl mx-auto space-y-12">
        <!-- Header -->
        <header class="space-y-4 border-b border-orange-100 pb-6">
            <a href="../"
                class="inline-flex items-center text-xs font-bold text-slate-400 hover:text-orange-600 transition-colors">
                ◀ INDEXに戻る
            </a>
            <div class="space-y-2">
                <div
                    class="inline-block bg-orange-100 text-orange-800 px-3 py-1 rounded-full text-xs font-black tracking-widest font-poppins">
                    GROUP 04</div>
                <h1 class="text-3xl md:text-4xl font-black text-slate-900">DO 句動詞 04｜多義語・注意</h1>
                <p class="text-orange-600 font-bold">多義語・注意すべき表現。</p>
            </div>
        </header>

        <!-- List -->
        <main class="grid md:grid-cols-2 gap-4">
            
            <div class="bg-white border border-slate-200 border-l-[6px] border-l-orange-400 rounded-2xl p-5 hover-card">
                <h3 class="text-lg font-bold font-poppins text-slate-800 mb-1"><span class="text-orange-500 mr-2">1.</span>do up</h3>
                <p class="text-sm text-slate-700 font-bold">改装する、包装する、着飾る</p>
            </div>
            
            <div class="bg-white border border-slate-200 border-l-[6px] border-l-orange-400 rounded-2xl p-5 hover-card">
                <h3 class="text-lg font-bold font-poppins text-slate-800 mb-1"><span class="text-orange-500 mr-2">2.</span>do with</h3>
                <p class="text-sm text-slate-700 font-bold">関係がある、処理する</p>
            </div>
            
            <div class="bg-white border border-slate-200 border-l-[6px] border-l-orange-400 rounded-2xl p-5 hover-card">
                <h3 class="text-lg font-bold font-poppins text-slate-800 mb-1"><span class="text-orange-500 mr-2">3.</span>do for</h3>
                <p class="text-sm text-slate-700 font-bold">〜のために働く、台無しにする</p>
            </div>
            
            <div class="bg-white border border-slate-200 border-l-[6px] border-l-orange-400 rounded-2xl p-5 hover-card">
                <h3 class="text-lg font-bold font-poppins text-slate-800 mb-1"><span class="text-orange-500 mr-2">4.</span>do in</h3>
                <p class="text-sm text-slate-700 font-bold">疲れさせる、殺す</p>
            </div>
            
            <div class="bg-white border border-slate-200 border-l-[6px] border-l-orange-400 rounded-2xl p-5 hover-card">
                <h3 class="text-lg font-bold font-poppins text-slate-800 mb-1"><span class="text-orange-500 mr-2">5.</span>do over</h3>
                <p class="text-sm text-slate-700 font-bold">やり直す、襲う</p>
            </div>
            
            <div class="bg-white border border-slate-200 border-l-[6px] border-l-orange-400 rounded-2xl p-5 hover-card">
                <h3 class="text-lg font-bold font-poppins text-slate-800 mb-1"><span class="text-orange-500 mr-2">6.</span>do out</h3>
                <p class="text-sm text-slate-700 font-bold">掃除する、装飾する</p>
            </div>
            
            <div class="bg-white border border-slate-200 border-l-[6px] border-l-orange-400 rounded-2xl p-5 hover-card">
                <h3 class="text-lg font-bold font-poppins text-slate-800 mb-1"><span class="text-orange-500 mr-2">7.</span>do by</h3>
                <p class="text-sm text-slate-700 font-bold">扱う、処遇する</p>
            </div>
            
            <div class="bg-white border border-slate-200 border-l-[6px] border-l-orange-400 rounded-2xl p-5 hover-card">
                <h3 class="text-lg font-bold font-poppins text-slate-800 mb-1"><span class="text-orange-500 mr-2">8.</span>do down</h3>
                <p class="text-sm text-slate-700 font-bold">けなす、批判する</p>
            </div>
            
            <div class="bg-white border border-slate-200 border-l-[6px] border-l-orange-400 rounded-2xl p-5 hover-card">
                <h3 class="text-lg font-bold font-poppins text-slate-800 mb-1"><span class="text-orange-500 mr-2">9.</span>do out of</h3>
                <p class="text-sm text-slate-700 font-bold">騙し取る</p>
            </div>
            
            <div class="bg-white border border-slate-200 border-l-[6px] border-l-orange-400 rounded-2xl p-5 hover-card">
                <h3 class="text-lg font-bold font-poppins text-slate-800 mb-1"><span class="text-orange-500 mr-2">10.</span>do with / do without</h3>
                <p class="text-sm text-slate-700 font-bold">使う vs なしで済ませる</p>
            </div>
            
        </main>

        <!-- Navigation Footer -->
        <footer
            class="flex flex-col md:flex-row justify-between items-center gap-6 py-10 mt-12 border-t border-slate-200">
            <div class="w-full md:w-auto"><span></span></div>
            <a href="../" class="text-sm font-black text-slate-500 hover:text-orange-600 transition-colors">
                ← 一覧に戻る
            </a>
            <div class="w-full md:w-auto text-right">
                
            </div>
        </footer>
    </div>
</body>

</html>
