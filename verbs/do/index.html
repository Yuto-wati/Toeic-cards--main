<!doctype html>
<html lang="ja">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>do｜全体マップ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&family=Poppins:wght@600;700&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans JP', system-ui, sans-serif;
            background-color: #f1f5f9;
            color: #334155;
        }

        .font-poppins {
            font-family: 'Poppins', system-ui, sans-serif;
        }

        /* Animation Definitions */
        .fade-in-up {
            animation: fadeInUp 0.8s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .delay-100 {
            animation-delay: 0.1s;
        }

        .delay-200 {
            animation-delay: 0.2s;
        }

        /* Card Hover Effect */
        .hover-card {
            transition: all 0.3s ease;
        }

        .hover-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>

<body class="p-6 md:p-12">
    <div class="max-w-6xl mx-auto space-y-16">

        <!-- Header -->
        <header class="text-center space-y-6 fade-in-up">
            <div class="inline-flex items-center gap-2 text-sm font-black text-slate-400">
                <a href="../" class="hover:text-blue-600 transition-colors">VERBS</a>
                <span>/</span>
                <span class="text-blue-600">do</span>
            </div>

            <h1 class="text-4xl md:text-5xl font-black text-slate-900 leading-tight">
                do の全体マップ
            </h1>

            <p class="text-lg font-bold text-slate-500">
                「行動」「完遂」イメージで、日常会話からビジネスまで攻略する。
            </p>
        </header>

        <!-- Content Grid -->
        <section class="grid md:grid-cols-2 gap-6 fade-in-up delay-100">

            <!-- Core Image Card -->
            <a href="./core/index.html"
                class="block bg-white border border-slate-200 rounded-3xl p-8 shadow-sm hover-card group relative overflow-hidden">
                <div
                    class="absolute top-0 right-0 w-24 h-24 bg-blue-50 rounded-bl-full -mr-4 -mt-4 opacity-50 group-hover:scale-110 transition-transform">
                </div>

                <div class="relative">
                    <div class="flex items-center justify-between mb-4">
                        <span
                            class="text-xs font-black text-blue-700 bg-blue-50 px-3 py-1 rounded-full border border-blue-100">CORE</span>
                        <span class="text-2xl">🎯</span>
                    </div>
                    <h3 class="mt-4 text-2xl font-black text-slate-800 group-hover:text-blue-700 transition-colors">
                        コアイメージ（完全解説）
                    </h3>
                    <p class="mt-3 text-sm font-bold text-slate-500 leading-relaxed">
                        意味の核から、全用法を一本で理解。<br>なぜ「〜する」も「間に合う」も do なのか？
                    </p>
                    <div class="mt-6 pt-4 border-t border-slate-100">
                        <p
                            class="text-xs font-black text-slate-400 tracking-widest group-hover:text-blue-600 transition-colors">
                            OPEN</p>
                    </div>
                </div>
            </a>

            <!-- Phrasal Verbs Card -->
            <a href="./phrasal/index.html"
                class="block bg-white border border-slate-200 rounded-3xl p-8 shadow-sm hover-card group relative overflow-hidden">
                <div
                    class="absolute top-0 right-0 w-24 h-24 bg-indigo-50 rounded-bl-full -mr-4 -mt-4 opacity-50 group-hover:scale-110 transition-transform">
                </div>

                <div class="relative">
                    <div class="flex items-center justify-between mb-4">
                        <span
                            class="text-xs font-black text-indigo-700 bg-indigo-50 px-3 py-1 rounded-full border border-indigo-100">PHRASAL</span>
                        <span class="text-2xl">🗺️</span>
                    </div>
                    <h3 class="mt-4 text-2xl font-black text-slate-800 group-hover:text-indigo-700 transition-colors">
                        句動詞（早見 & 解説）
                    </h3>
                    <p class="mt-3 text-sm font-bold text-slate-500 leading-relaxed">
                        do up / over / without… を地図化。<br>「実行・完了」イメージで熟語を攻略する。
                    </p>
                    <div class="mt-6 pt-4 border-t border-slate-100">
                        <p
                            class="text-xs font-black text-slate-400 tracking-widest group-hover:text-indigo-600 transition-colors">
                            OPEN</p>
                    </div>
                </div>
            </a>

        </section>

        <!-- Footer -->
        <footer
            class="text-center text-xs text-slate-400 font-bold py-10 border-t border-slate-200 mt-12 fade-in-up delay-200">
            <a href="../../" class="inline-flex items-center gap-2 hover:text-blue-600 transition-colors">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                </svg>
                トップへ戻る
            </a>
        </footer>

    </div>
</body>

</html>
