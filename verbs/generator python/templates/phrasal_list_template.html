<!doctype html>
<html lang="ja">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>{{ verb_title }} 句動詞 {{ group_str }}｜{{ subtitle }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&family=Poppins:wght@600;700&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: #f8fafc;
            color: #334155;
        }

        .font-poppins {
            font-family: 'Poppins', sans-serif;
        }

        .hover-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .hover-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, .1);
        }
    </style>
</head>

<body class="p-6 md:p-12">
    <div class="max-w-4xl mx-auto space-y-12">
        <!-- Header -->
        <header class="space-y-4 border-b border-orange-100 pb-6">
            <a href="../"
                class="inline-flex items-center text-xs font-bold text-slate-400 hover:text-orange-600 transition-colors">
                ◀ INDEXに戻る
            </a>
            <div class="space-y-2">
                <div
                    class="inline-block bg-orange-100 text-orange-800 px-3 py-1 rounded-full text-xs font-black tracking-widest font-poppins">
                    GROUP {{ group_str }}</div>
                <h1 class="text-3xl md:text-4xl font-black text-slate-900">{{ verb_title }} 句動詞 {{ group_str }}｜{{
                    subtitle }}</h1>
                <p class="text-orange-600 font-bold">{{ description }}</p>
            </div>
        </header>

        <!-- List -->
        <main class="grid md:grid-cols-2 gap-4">
            {% for p in phrases %}
            <div class="bg-white border border-slate-200 border-l-[6px] border-l-orange-400 rounded-2xl p-5 hover-card">
                <h3 class="text-lg font-bold font-poppins text-slate-800 mb-1"><span class="text-orange-500 mr-2">{{
                        loop.index }}.</span>{{ p.phrase }}</h3>
                <p class="text-sm text-slate-700 font-bold">{{ p.trans }}</p>
            </div>
            {% endfor %}
        </main>

        <!-- Navigation Footer -->
        <footer
            class="flex flex-col md:flex-row justify-between items-center gap-6 py-10 mt-12 border-t border-slate-200">
            <div class="w-full md:w-auto"><span></span></div>
            <a href="../" class="text-sm font-black text-slate-500 hover:text-orange-600 transition-colors">
                ← 一覧に戻る
            </a>
            <div class="w-full md:w-auto text-right">
                {% if next_group_url %}
                <a href="{{ next_group_url }}"
                    class="text-sm font-black text-slate-700 hover:text-orange-600 transition-colors">次へ →</a>
                {% endif %}
            </div>
        </footer>
    </div>
</body>

</html>
