<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>run_002 Slide 4｜実用イメージ</title>
  <style>
    /* 縦 1080x1920 を想定した“キャンバス” */
    body { margin:0; background:#0b0b0f; }
    .canvas{
      width:1080px; height:1920px;
      margin:0 auto;
      display:flex; align-items:center; justify-content:center;
      font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans JP", sans-serif;
      color:#f6f7fb;
    }
    .card{
      width:920px;
      border-radius:32px;
      padding:64px 64px 56px;
      background: rgba(255,255,255,0.06);
      box-shadow: 0 20px 60px rgba(0,0,0,0.45);
      border: 1px solid rgba(255,255,255,0.10);
    }
    .badge{
      display:inline-block;
      font-weight:700;
      letter-spacing:.02em;
      opacity:.9;
      margin-bottom:28px;
    }
    .main{
      font-size:86px;
      line-height:1.15;
      font-weight:800;
      letter-spacing:-.02em;
      white-space:pre-line; /* 改行を効かせる */
      margin:0 0 28px 0;
    }
    .sub{
      font-size:44px;
      line-height:1.35;
      opacity:.92;
      white-space:pre-line;
      margin:0;
    }
    .note{
      margin-top:36px;
      font-size:34px;
      opacity:.75;
      white-space:pre-line;
    }
    .em{ font-weight:900; text-decoration: underline; text-underline-offset: 10px; }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="card">
      <div class="badge">USAGE</div>
      <h1 class="main">ビジネスや組織を「継続的に動かす」というニュアンス</h1>
      <p class="sub"></p>
      <div class="note">場面が見えると覚えやすい</div>
    </div>
  </div>
</body>
</html>
